<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign In · Aura Space</title>
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Ccircle cx='50' cy='50' r='44' stroke='%23C89B8B' stroke-width='6' stroke-opacity='0.3'/%3E%3Ccircle cx='50' cy='50' r='30' stroke='%23C89B8B' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' stroke='%23C89B8B' stroke-width='2' fill='%23C89B8B' fill-opacity='0.2'/%3E%3Cpath d='M50 10 L50 90 M10 50 L90 50' stroke='%23C89B8B' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
      <script src="tailwind.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontWeight: { bold: '600', extrabold: '600', semibold: '550' },
                    colors: {
                        brand: {
                            primary: '#1E1A17',
                            secondary: '#3D352E',
                            muted: '#7A6E64',
                            border: '#E5D9D0',
                            accent: '#C89B8B',
                            'accent-dark': '#B08474',
                            'accent-light': '#F2E3DB',
                            bg: '#FCF8F5',
                            'bg-soft': '#F8F0EB',
                        },
                        custom: {
                            clay: '#C89B8B',
                            'clay-light': '#F2E3DB',
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
                    },
                    backgroundImage: {
                        'warm-pattern': 'radial-gradient(circle at 20% 30%, rgba(200,155,139,0.08) 0%, transparent 60%)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        h1, h2, h3, h4, h5, h6 { font-weight: 600 !important; }
        p { font-weight: 400; }
        p strong, p b, p .font-bold, p .font-semibold { font-weight: 550 !important; }
        .font-extrabold { font-weight: 800 !important; }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FCF8F5;
            color: #1E1A17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .dark body { background-color: #1A1614; color: #EDE6E0; }
        .dark .text-brand-primary { color: #EDE6E0; }
        .dark .text-brand-secondary { color: #CEC3BA; }
        .dark .text-brand-muted { color: #9E8F84; }
        /* Light mode contrast enhancements for readability */
        html:not(.dark) .text-\[\#7A6E64\],
        html:not(.dark) .text-brand-muted { color: #4D4036 !important; }
        html:not(.dark) .text-\[\#3D352E\] { color: #2D241E !important; }
        html:not(.dark) .card-design p { color: #4D4036; }
        html:not(.dark) .card-design .text-\[\#C89B8B\] { color: #A65A48; }

        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            color: #1E1A17;
            transition: all 0.2s ease;
            border: 1px solid #E5D9D0;
            cursor: pointer;
            font-size: 1rem;
        }
        .dark .toggle-btn { background: #2A2420; color: #EDE6E0; border-color: #3D352E; }
        .toggle-btn:hover { background: #C89B8B; color: #1E1A17; }
        .dark .toggle-btn:hover { background: #C89B8B; color: #1E1A17; }

        .login-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 2.5rem 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(200,155,139,0.12);
            border: 1px solid #E5D9D0;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }
        .dark .login-card { background: #2A2420; border-color: #3D352E; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

        .login-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1.5px solid #E5D9D0;
            background: #FCF8F5;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #1E1A17;
        }
        .dark .login-input { background: #1A1614; border-color: #3D352E; color: #EDE6E0; }
        .login-input:focus { outline: none; border-color: #C89B8B; box-shadow: 0 0 0 4px rgba(200,155,139,0.15); }

        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper .login-input { padding-right: 3rem; }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #C89B8B;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover { color: #B08474; }

        [dir="rtl"] .toggle-password { right: auto; left: 1rem; }
        [dir="rtl"] .password-wrapper .login-input { padding-right: 1.2rem; padding-left: 3rem; }
        [dir="rtl"] .input-icon { left: auto; right: 1.1rem; }

        .btn-primary-design {
            background: #1E1A17;
            color: #FCF8F5;
            font-weight: 600;
            padding: 0.85rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }
        .btn-primary-design:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(200,155,139,0.35);
            background: #3D352E;
        }
        .dark .btn-primary-design { background: #FCF8F5; color: #1E1A17; }
        .dark .btn-primary-design:hover { background: #F2E3DB; color: #1E1A17; }

        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid #E5D9D0;
            background: #FFFFFF;
            color: #1E1A17;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
        }
        .dark .social-btn { background: #1A1614; border-color: #3D352E; color: #EDE6E0; }
        .social-btn:hover { background: #F8F0EB; border-color: #C89B8B; transform: translateY(-2px); }
        .dark .social-btn:hover { background: #2A2420; border-color: #C89B8B; }
        .social-btn i { font-size: 1.1rem; color: #C89B8B; }

        .brand-logo {
            background: #C89B8B;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(200,155,139,0.25);
            transition: all 0.3s ease;
        }
        .brand-logo:hover { transform: scale(1.05) rotate(-4deg); }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1E1A17;
            margin-top: 1.5rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }
        .dark .welcome-title { color: #EDE6E0; }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #3D352E;
            text-align: center;
        }
        .dark .welcome-subtitle { color: #CEC3BA; }

        @media (max-height: 650px) {
            .login-card { padding: 1.2rem 1.5rem; transform: scale(0.92); transform-origin: center; }
            .welcome-title { font-size: 1.3rem; margin-top: 0.5rem; }
            .welcome-subtitle { font-size: 0.8rem; }
            .login-input { padding: 0.6rem 0.8rem 0.6rem 2.5rem; font-size: 0.85rem; }
            .btn-primary-design { padding: 0.6rem 1rem; font-size: 0.9rem; }
            .brand-logo { width: 40px; height: 40px; }
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.4rem; }
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        .text-brand-accent { color: #C89B8B; }
        .hover\:text-brand-accent-dark:hover { color: #B08474; }
    </style>
</head>

<body class="warm-pattern">

    <!-- Theme Toggles -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            <i class="fas fa-exchange-alt"></i>
        </button>
    </div>

    <!-- Login Card -->
    <div class="container mx-auto px-6 sm:px-8 lg:px-12 max-w-[460px]">
        <div class="login-card animate-fade-in">

            <div class="text-center mb-6">
                <a href="index.html" class="inline-flex items-center gap-3 group">
                    <svg class="w-9 h-9 text-[#C89B8B] group-hover:rotate-45 transition-transform duration-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="6" stroke-opacity="0.3"/>
                        <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="6" />
                        <circle cx="50" cy="50" r="14" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.2"/>
                        <path d="M50 10 L50 90" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M10 50 L90 50" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span class="text-2xl font-display font-extrabold tracking-tight text-[#1E1A17] dark:text-white">AURA<span class="text-[#C89B8B]">SPACE</span></span>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to access your design projects and client portal</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#C89B8B] input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" id="login-email" placeholder="Email address" required class="login-input text-sm md:text-base">
                </div>

                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#C89B8B] input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" placeholder="Password" required class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer text-[#3D352E] dark:text-[#CEC3BA]">
                        <input type="checkbox" class="rounded border-[#E5D9D0] dark:border-[#3D352E] text-[#C89B8B] focus:ring-[#C89B8B]/30">
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink" class="text-[#1E1A17] dark:text-[#EDE6E0] hover:text-[#C89B8B] font-medium transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn-primary-design mt-2">
                    Sign In <i class="fas fa-arrow-right ml-2 rtl:mr-2 rtl:ml-0"></i>
                </button>

                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-[#E5D9D0] dark:border-[#3D352E]"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="bg-white dark:bg-[#2A2420] px-4 text-[#7A6E64] dark:text-[#9E8F84]">or continue with</span>
                    </div>
                </div>
            </form>

            <!-- Social Login -->
            <div class="grid grid-cols-2 gap-3 mt-4">
                <button class="social-btn" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn" onclick="socialLogin('apple')">
                    <i class="fab fa-apple"></i> Apple
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-[#E5D9D0] dark:border-[#3D352E]/40">
                <p class="text-sm font-medium text-[#3D352E] dark:text-[#CEC3BA]">
                    New to Aura Space?
                    <a href="signup.html" class="text-[#C89B8B] hover:text-[#B08474] font-bold transition ml-1 rtl:mr-1 hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'dark');
            if (themeToggle) themeToggle.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));

            // RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }
            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');
            if (rtlBtn) rtlBtn.addEventListener('click', () => setRTL(document.documentElement.dir !== 'rtl'));

            // Password Toggle
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = document.getElementById(this.dataset.target);
                    if (target) {
                        const isPassword = target.type === 'password';
                        target.type = isPassword ? 'text' : 'password';
                        const icon = this.querySelector('i');
                        icon.className = isPassword ? 'far fa-eye' : 'far fa-eye-slash';
                    }
                });
            });

            // Forgot Password
            document.getElementById('forgotPasswordLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('A password reset link will be sent to your email address.');
            });

            // Login Form
            document.getElementById('loginForm')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email')?.value;
                const password = document.getElementById('login-password')?.value;
                if (!email || !password) {
                    alert('Please enter both email and password.');
                    return;
                }
                // Store user session
                localStorage.setItem('currentUser', JSON.stringify({ name: 'Sarah Johnson', email: email }));
                window.location.href = 'index.html';
            });

            // Social Login
            window.socialLogin = function(provider) {
                alert(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here.\n\nWelcome to Aura Space!`);
            };
        });
    </script>
</body>
</html>
